apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hydra
  namespace: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hydra
      app.kubernetes.io/instance: hydra
  policyTypes: ["Ingress"]
  ingress:
    # Public OAuth2/OIDC endpoint (puerto 4444) desde Traefik (kube-system)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 4444

    # Admin API (puerto 4445) únicamente desde componentes autorizados en identity
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: kratos
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: oathkeeper
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hydra-maester
      ports:
        - protocol: TCP
          port: 4445
