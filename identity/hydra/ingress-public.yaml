apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hydra-public
  namespace: identity
spec:
  ingressClassName: traefik
  rules:
    - host: oauth.xuty.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hydra-public
                port:
                  number: 4444
