
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oathkeeper
  namespace: identity

spec:
  interval: 5m

  chart:
    spec:
      chart: oathkeeper
      version: "0.64.0"
      sourceRef:
        kind: HelmRepository
        name: ory
        namespace: identity

  values:
    maester:
      enabled: true

    oathkeeper:
      managedAccessRules: false

      config:
        serve:
          proxy:
            port: 4455
          api:
            port: 4456

        access_rules:
          matching_strategy: glob

        authenticators:
          cookie_session:
            enabled: true
            config:
              check_session_url: http://kratos-public.identity.svc.cluster.local:4433/sessions/whoami
              preserve_path: true
              subject_from: identity.id
              only:
                - ory_kratos_session

          oauth2_introspection:
            enabled: true
            config:
              introspection_url: http://hydra-admin.identity.svc.cluster.local:4445/admin/oauth2/introspect

          anonymous:
            enabled: true
            config:
              subject: guest

          noop:
            enabled: true

        authorizers:
          allow:
            enabled: true
          deny:
            enabled: true

        mutators:
          noop:
            enabled: true
          header:
            enabled: true

        errors:
          fallback:
            - json
          handlers:
            redirect:
              enabled: true
              config:
                to: https://auth.xuty.dev/login
                return_to_query_param: return_to
                when:
                  - error:
                      - unauthorized
                    request:
                      header:
                        accept:
                          - text/html

            json:
              enabled: true
              config:
                verbose: false

    ingress:
      proxy:
        enabled: false
      api:
        enabled: false
