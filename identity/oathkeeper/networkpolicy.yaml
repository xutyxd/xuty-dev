
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oathkeeper
  namespace: identity

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: oathkeeper

  policyTypes:
    - Ingress

  ingress:
    # Proxy: acceso desde el Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 4455

    # Decision API: únicamente aplicaciones autorizadas
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              oathkeeper-access: "true"
      ports:
        - protocol: TCP
          port: 4456
