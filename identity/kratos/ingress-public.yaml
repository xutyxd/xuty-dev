apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kratos-public
  namespace: identity
spec:
  ingressClassName: traefik
  rules:
    - host: api.auth.xuty.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kratos-public
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kratos-selfservice-ui-node
  namespace: identity
spec:
  ingressClassName: traefik
  rules:
    - host: auth.xuty.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kratos-selfservice-ui-node
                port:
                  number: 80
