apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keto-read
  namespace: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: keto
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: oathkeeper
      ports:
        - protocol: TCP
          port: 4466
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keto-write
  namespace: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: keto
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
      ports:
        - protocol: TCP
          port: 4467