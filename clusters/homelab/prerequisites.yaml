apiVersion: kustomize.toolkit.fluxcd.io/v1 # FluxCD kustomize-controller
kind: Kustomization
metadata:
  name: prerequisites
  namespace: flux-system
spec:
  interval: 10m
  path: ./prerequisites
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age