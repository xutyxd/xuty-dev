apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "v0.91.x"  # Check latest version: https://docs.victoriametrics.com/helm/victoria-metrics-k8s-stack/changelog/
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics   # <-- should match with metadata.name helmrepository.yaml
        namespace: observability
  values:
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "14d"  # 14 days, its a homelab
        storage:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 60Gi   # La mayoría de tu LV
          storageClassName: observability-local
    loki:
      enabled: true
      persistence:
        enabled: true
        size: 25Gi
        storageClassName: observability-local
    grafana:
      enabled: true
      grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.xuty.dev
    prometheus-node-exporter:
      enabled: true
    kube-state-metrics:
      enabled: true