apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "v0.91.x"  # Check latest version: https://docs.victoriametrics.com/helm/victoria-metrics-k8s-stack/changelog/
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics   # <-- should match with metadata.name helmrepository.yaml
        namespace: observability
  values:
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "14d"  # 14 days, its a homelab
        storage:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 60Gi   # La mayoría de tu LV
          storageClassName: observability-local
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: "7d"
        storage:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 25Gi
          storageClassName: observability-local

    vlagent:
      enabled: true
      spec:
        # Recolecta logs de todos los pods del cluster (equivalente a Promtail)
        k8sCollector:
          enabled: true
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.xuty.dev
      plugins:
        - victoriametrics-logs-datasource
    prometheus-node-exporter:
      enabled: true
      extraArgs:
        # Excluye los mounts de k3s containerd y netns que generan ruido
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/k3s/containerd/.+|run/netns/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        # Ya tienes fs-types-exclude, lo mantenemos
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
        # Deshabilita collectors pesados innecesarios para homelab
        - --no-collector.processes
        - --no-collector.systemd
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi
    kube-state-metrics:
      enabled: true