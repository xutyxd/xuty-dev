apiVersion: v1
kind: ConfigMap
metadata:
  name: victorialogs-datasource
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  victorialogs.yaml: |-
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        url: http://vlsingle-victoria-metrics-k8s-stack.observability.svc.cluster.local:9428
        access: proxy
        isDefault: false
        editable: false