apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: xuty-dev
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: Flux Bot
        email: flux@xuty.dev
      messageTemplate: "chore(images): automated update [{{ range .Updated.Images }}{{.}} {{end}}]"
    push:
      branch: main
  update:
    path: ./apps
    strategy: Setters