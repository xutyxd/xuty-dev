---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: xuty-dev
  namespace: flux-system
spec:
  image: xutyxd/xuty.dev
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: xuty-dev
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: xuty-dev
  policy:
    semver:
      range: ">=1.0.0"