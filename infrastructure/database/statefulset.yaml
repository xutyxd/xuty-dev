apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine # TODO pin digest
          args:
            - -c
            - shared_buffers=128MB
            - -c
            - max_connections=100
          env:
            - name: POSTGRES_DB
              value: postgres

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

            - name: KRATOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-ory-credentials
                  key: KRATOS_PASSWORD

            - name: HYDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-ory-credentials
                  key: HYDRA_PASSWORD

            - name: KETO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-ory-credentials
                  key: KETO_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: database-local
        resources:
          requests:
            storage: 20Gi
