apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: xuty-dev

resources:
  - ../base                     # Reference to base resources
  - namespace.yaml

namePrefix: xuty-dev-

commonLabels:                   # Labels to be applied to all resources
  app: xuty-dev

patches:
  - path: deployment-patch.yaml
  - path: ingress-patch.yaml